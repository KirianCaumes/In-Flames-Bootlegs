<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
>
    <!-- Background -->
    <rect
        width="100"
        height="100"
        rx="12"
        fill="#111111"
    />

    <!-- Ticket body -->
    <rect
        x="6"
        y="23"
        width="88"
        height="54"
        rx="8"
        fill="#D50209"
    />

    <!-- Stub notch cutouts -->
    <circle
        cx="71"
        cy="23"
        r="8"
        fill="#111111"
    />
    <circle
        cx="71"
        cy="77"
        r="8"
        fill="#111111"
    />

    <!-- Perforation dashes -->
    <line
        x1="71"
        y1="31"
        x2="71"
        y2="69"
        stroke="#111111"
        stroke-width="2.5"
        stroke-dasharray="4,3"
    />

    <!-- Title line -->
    <rect
        x="15"
        y="34"
        width="45"
        height="5"
        rx="2.5"
        fill="#ff6060"
    />
    <!-- Subtitle line -->
    <rect
        x="15"
        y="45"
        width="37"
        height="3.5"
        rx="1.75"
        fill="#ff6060"
        opacity="0.65"
    />
    <!-- Detail line -->
    <rect
        x="15"
        y="54"
        width="29"
        height="3"
        rx="1.5"
        fill="#ff6060"
        opacity="0.4"
    />
    <!-- Date line -->
    <rect
        x="15"
        y="63"
        width="36"
        height="2.5"
        rx="1.25"
        fill="#ff6060"
        opacity="0.25"
    />
</svg>
